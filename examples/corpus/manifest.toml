# Example corpus: small, but with every source type, two revisions of one manual and real
# access rules. The documents are fictional, written for this repository; the PDFs are built by
# make_pdfs.py. Replace it with real, messy documents for a meaningful evaluation (README,
# "Build a real corpus").
uri_prefix = "corpus://maintenance/"
base_dir = "."

[defaults]
acl_groups = ["maintenance"]
language = "fr"

# PDF with tables, a running header/footer and a scanned annex page (no text layer).
[[documents]]
path = "manuals/pompe_p200_rev_c.pdf"
doc_key = "manual-p200"
version = "C"
title = "Manuel de maintenance — Pompe centrifuge P-200 (Rév. C)"
acl_groups = ["maintenance", "methodes"]
metadata = { equipment = "P-200", effective_date = "2025-06-01" }

# The previous revision, listed (and ingested) after C: it must still never be searched.
[[documents]]
path = "manuals/pompe_p200_rev_b.pdf"
doc_key = "manual-p200"
version = "B"
title = "Manuel de maintenance — Pompe centrifuge P-200 (Rév. B)"
acl_groups = ["maintenance", "methodes"]
metadata = { equipment = "P-200", effective_date = "2023-03-15" }

[[documents]]
path = "procedures/remplacement_garniture_p200.html"
doc_key = "proc-garniture-p200"
version = "2"

[[documents]]
path = "procedures/alignement_laser_p200.md"
doc_key = "proc-alignement-p200"
version = "1"

# Readable by the methods team only: maintenance users must not get answers from it.
[[documents]]
path = "notes/nt_2025_07_graisse_synthetique.md"
doc_key = "nt-2025-07"
version = "1"
acl_groups = ["methodes"]

[[documents]]
path = "records/interventions_p200.csv"
title = "Historique des interventions P-200"
record_id_field = "ot_id"
record_text_fields = ["equipement", "symptome", "diagnostic", "action"]
